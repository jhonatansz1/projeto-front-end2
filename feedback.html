</head>
<body>
<header class="site-header">
  <nav class="navbar" aria-label="Menu principal">
    <a class="brand" href="index.html">GAMES</a>
    <div class="nav-links nav">
      <a class="nav-link" href="index.html">CS2</a>

    </div>
  </nav>
</header>
<main class="container">
<section class="hero">
  <h1>Deixe sua ajuda!</h1>
  <img src="img/feed2.jpg" alt="Imagem feedback" class="feed-img">
</section>
<section class="section">
  <h2>Formulário de feedback</h2>
  <form id="contact-form">
    <label for="nome">Nome</label>
    <input type="text" id="nome" name="nome" class="form-control" placeholder="Digite seu nome" required minlength="3" pattern="[A-Za-zÀ-ÿ ]+" title="Digite apenas letras e espaços.">
    <label for="email">E-mail</label>
    <input type="email" id="email" name="email" class="form-control" placeholder="nome@exemplo.com" required>
    <label for="assunto">Assunto</label>
    <select id="assunto" name="assunto" class="form-select" required>
    <option value="">Selecione um assunto</option>
    <option value="duvida">Dúvida</option>
    <option value="sugestao">Sugestão</option>
    <option value="outro">Outro</option>
    </select>
    <label for="mensagem">Mensagem</label>
    <textarea id="mensagem" name="mensagem" class="form-control" placeholder="Escreva sua mensagem" required minlength="10"></textarea>
    <button type="submit" class="btn btn-warning">Enviar</button>
    <div id="form-alert" class="alert alert-success mt-3 d-none" role="alert">
    Mensagem enviada com sucesso!
    </div>
  </form>
<ul id="saved-messages" class="saved-messages" aria-live="polite"></ul>
</section>
</main>
<footer class="site-footer"><p>PÁGINA 10 DE 10</p></footer>
<script src="js/script.js"></script>
</body>
</html>
